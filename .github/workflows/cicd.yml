name: CI/CD Pipeline

on:
  push:
    branches:
      - main


  pull_request:
    branches:
      - main
jobs:

  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          echo "Building application..."
          mkdir build
          echo "Build completed"
          echo "Hello, ${{vars.MY_NAME}}"
          echo "I am from : ${{vars.MY_CITY}}"

  test-job:
    runs-on: ubuntu-latest
    needs: build-job

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Running tests..."
          echo "All tests passed"

  deploy-job:
    runs-on: ubuntu-latest
    needs: test-job

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Deploying application..."
          echo "Deployment successful"
